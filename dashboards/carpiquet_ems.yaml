title: Carpiquet EMS
views:
  - title: Cockpit
    path: cockpit
    icon: mdi:home-lightning-bolt
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |
              # 🏴 Carpiquet EMS
              **Every watt counts.**

              *Intelligent energy management for Zendure.*

              **Mode : SIMULATION**
              **Sprint 5 — EMS Core Logic**
          - type: tile
            entity: sensor.carpiquet_ems_system_status
            name: État général
            icon: mdi:heart-pulse
          - type: gauge
            entity: sensor.carpiquet_ems_health_score
            name: Santé EMS
            min: 0
            max: 100
            severity:
              red: 0
              yellow: 67
              green: 100

      - type: grid
        title: Synthèse système
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.carpiquet_ems_active_batteries
                name: Batteries actives
              - entity: sensor.carpiquet_ems_total_batteries
                name: Batteries détectées
              - entity: sensor.carpiquet_ems_total_battery_capacity
                name: Capacité totale
              - entity: sensor.carpiquet_ems_average_battery_soc
                name: SOC moyen
              - entity: sensor.carpiquet_ems_total_available_power
                name: Puissance disponible
              - entity: sensor.carpiquet_ems_system_status
                name: État
              - entity: sensor.carpiquet_ems_data_mode
                name: État des données
              - entity: sensor.carpiquet_ems_fallback_active_count
                name: Fallbacks actifs
              - entity: switch.carpiquet_ems_automation_engine
                name: Moteur d'automatisation
              - entity: sensor.carpiquet_ems_automation_state
                name: État du moteur

      - type: grid
        title: Réseau
        cards:
          - type: gauge
            entity: sensor.carpiquet_ems_grid_power
            name: Réseau EDF
            min: -1000
            max: 3600
            needle: true
            severity:
              green: -1000
              yellow: 20
              red: 1000
          - type: entities
            title: Régulation
            show_header_toggle: false
            entities:
              - entity: sensor.carpiquet_ems_grid_power
                name: Import / export
              - entity: sensor.carpiquet_ems_requested_discharge
                name: Décharge demandée
              - entity: sensor.carpiquet_ems_effective_request
                name: Demande effective
              - entity: sensor.carpiquet_ems_unserved_power
                name: Puissance non servie
              - entity: sensor.carpiquet_ems_total_simulated_battery_power
                name: Puissance simulée totale
              - entity: sensor.carpiquet_ems_simulated_grid_power
                name: Réseau simulé
              - entity: number.carpiquet_ems_grid_target
                name: Cible réseau
              - entity: number.carpiquet_ems_grid_deadband
                name: Plage de lissage
              - entity: number.carpiquet_ems_ramp_limit
                name: Rampe

      - type: grid
        title: Hyper 2000
        cards:
          - type: gauge
            entity: sensor.carpiquet_ems_hyper_2000_soc
            name: SOC Hyper
            min: 0
            max: 100
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.carpiquet_ems_hyper_2000_pv_power
                name: Puissance PV
              - entity: sensor.carpiquet_ems_hyper_2000_simulated_power
                name: Puissance simulée
              - entity: sensor.carpiquet_ems_hyper_2000_capacity
                name: Capacité totale
              - entity: sensor.carpiquet_ems_hyper_2000_max_power
                name: Puissance maximale
              - entity: sensor.carpiquet_ems_hyper_2000_min_soc
                name: SOC minimum
              - entity: sensor.carpiquet_ems_hyper_2000_max_soc
                name: SOC maximum
              - entity: binary_sensor.carpiquet_ems_hyper_2000_health
                name: Santé

      - type: grid
        title: SolarFlow 2400 Pro
        cards:
          - type: gauge
            entity: sensor.carpiquet_ems_solarflow_2400_pro_soc
            name: SOC SolarFlow
            min: 0
            max: 100
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.carpiquet_ems_solarflow_2400_pro_pv_power
                name: Puissance PV
              - entity: sensor.carpiquet_ems_solarflow_2400_pro_simulated_power
                name: Puissance simulée
              - entity: sensor.carpiquet_ems_solarflow_2400_pro_capacity
                name: Capacité totale
              - entity: sensor.carpiquet_ems_solarflow_2400_pro_max_power
                name: Puissance maximale
              - entity: sensor.carpiquet_ems_solarflow_2400_pro_min_soc
                name: SOC minimum
              - entity: sensor.carpiquet_ems_solarflow_2400_pro_max_soc
                name: SOC maximum
              - entity: binary_sensor.carpiquet_ems_solarflow_2400_pro_health
                name: Santé

  - title: Santé
    path: health
    icon: mdi:heart-pulse
    type: sections
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |
              # ❤️ Centre de santé EMS
              Disponibilité des sources et état du mode secours.
          - type: gauge
            entity: sensor.carpiquet_ems_health_score
            name: Score global
            min: 0
            max: 100
          - type: entities
            title: Composants
            show_header_toggle: false
            entities:
              - entity: binary_sensor.carpiquet_ems_grid_meter_health
                name: Santé compteur réseau
              - entity: binary_sensor.carpiquet_ems_hyper_2000_health
                name: Santé Hyper 2000
              - entity: binary_sensor.carpiquet_ems_solarflow_2400_pro_health
                name: Santé SolarFlow 2400 Pro
              - entity: sensor.carpiquet_ems_system_status
                name: État système
              - entity: sensor.carpiquet_ems_data_mode
                name: Mode des données
              - entity: sensor.carpiquet_ems_last_fallback_sync
                name: Dernière synchronisation fallback

  - title: Historique
    path: history
    icon: mdi:chart-line
    cards:
      - type: history-graph
        title: Réseau et simulation — 24 h
        hours_to_show: 24
        entities:
          - sensor.carpiquet_ems_grid_power
          - sensor.carpiquet_ems_total_simulated_battery_power
          - sensor.carpiquet_ems_simulated_grid_power
      - type: history-graph
        title: SOC — 24 h
        hours_to_show: 24
        entities:
          - sensor.carpiquet_ems_hyper_2000_soc
          - sensor.carpiquet_ems_solarflow_2400_pro_soc
      - type: history-graph
        title: Production PV — 24 h
        hours_to_show: 24
        entities:
          - sensor.carpiquet_ems_hyper_2000_pv_power
          - sensor.carpiquet_ems_solarflow_2400_pro_pv_power

  - title: Zendure
    path: zendure
    icon: mdi:battery-sync
    type: sections
    max_columns: 4
    sections:
      - type: grid
        title: Sources dynamiques
        cards:
          - type: entities
            title: Live / Fallback
            show_header_toggle: false
            entities:
              - entity: sensor.carpiquet_ems_data_mode
                name: Mode des données
              - entity: sensor.carpiquet_ems_fallback_active_count
                name: Fallbacks actifs
              - entity: switch.carpiquet_ems_automation_engine
                name: Moteur d'automatisation
              - entity: sensor.carpiquet_ems_automation_state
                name: État du moteur
              - entity: sensor.carpiquet_ems_last_fallback_sync
                name: Dernière synchronisation

      - type: grid
        title: Hyper 2000 — Zendure
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.hyper_2000_electric_level
                name: Niveau de batterie
              - entity: sensor.hyper_2000_total_kwh
                name: Capacité totale
              - entity: sensor.hyper_2000_available_kwh
                name: Énergie disponible
              - entity: sensor.hyper_2000_pack_num
                name: Nombre de batteries
              - entity: sensor.hyper_2000_inverse_max_power
                name: Puissance maximale
              - entity: number.hyper_2000_min_soc
                name: SOC minimum
              - entity: number.hyper_2000_soc_set
                name: SOC maximum
              - entity: sensor.hyper_2000_solar_input_power
                name: Puissance d'entrée solaire
              - entity: sensor.hyper_2000_output_home_power
                name: Puissance de sortie
              - entity: sensor.hyper_2000_hyper_tmp
                name: Température
              - entity: sensor.hyper_2000_remaining_time
                name: Temps restant
              - entity: sensor.hyper_2000_roundtrip_efficiency
                name: Rendement aller-retour
              - entity: binary_sensor.hyper_2000_wifi_state
                name: État du Wi-Fi
              - entity: binary_sensor.hyper_2000_hems_state
                name: HEMS actif

      - type: grid
        title: SolarFlow 2400 Pro — Zendure
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.solarflow_2400_pro_electric_level
                name: Niveau de batterie
              - entity: sensor.solarflow_2400_pro_total_kwh
                name: Capacité totale
              - entity: sensor.solarflow_2400_pro_available_kwh
                name: Énergie disponible
              - entity: sensor.solarflow_2400_pro_pack_num
                name: Nombre de batteries
              - entity: sensor.solarflow_2400_pro_inverse_max_power
                name: Puissance maximale
              - entity: number.solarflow_2400_pro_min_soc
                name: SOC minimum
              - entity: number.solarflow_2400_pro_soc_set
                name: SOC maximum
              - entity: sensor.solarflow_2400_pro_solar_input_power
                name: Puissance d'entrée solaire
              - entity: sensor.solarflow_2400_pro_output_home_power
                name: Puissance de sortie
              - entity: sensor.solarflow_2400_pro_hyper_tmp
                name: Température
              - entity: sensor.solarflow_2400_pro_remaining_time
                name: Temps restant
              - entity: sensor.solarflow_2400_pro_roundtrip_efficiency
                name: Rendement aller-retour
              - entity: sensor.solarflow_2400_pro_rssi
                name: RSSI
              - entity: binary_sensor.solarflow_2400_pro_hems_state
                name: HEMS actif

      # __CARPIQUET_BATTERY_CARDS__


  - title: Automatisation
    path: automation
    icon: mdi:robot-industrial
    type: sections
    max_columns: 4
    sections:
      - type: grid
        title: Moteur d'automatisation
        cards:
          - type: markdown
            content: |
              # 🤖 Moteur d'automatisation
              **Sprint 5 — Simulation uniquement**

              Le moteur décide quand l'EMS simulé doit rester inactif,
              passer en décharge ou se placer en sécurité.

              **Aucune commande réelle Zendure n'est envoyée.**
          - type: entities
            title: État
            show_header_toggle: false
            entities:
              - entity: switch.carpiquet_ems_automation_engine
                name: Moteur activé
              - entity: sensor.carpiquet_ems_automation_state
                name: État
              - entity: sensor.carpiquet_ems_automation_reason
                name: Raison
              - entity: binary_sensor.carpiquet_ems_automation_safety_gate
                name: Garde-fou sécurité
              - entity: sensor.carpiquet_ems_automation_policy
                name: Stratégie
              - entity: sensor.carpiquet_ems_automation_cycle
                name: Cycle
              - entity: sensor.carpiquet_ems_automation_last_transition
                name: Dernière transition
              - entity: sensor.carpiquet_ems_automation_hold_remaining
                name: Temporisation restante

      - type: grid
        title: Décision
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.carpiquet_ems_grid_power
                name: Réseau
              - entity: number.carpiquet_ems_grid_target
                name: Cible réseau
              - entity: number.carpiquet_ems_grid_deadband
                name: Plage de lissage
              - entity: sensor.carpiquet_ems_requested_discharge
                name: Demande EMS
              - entity: sensor.carpiquet_ems_automation_request
                name: Demande automation
              - entity: sensor.carpiquet_ems_total_simulated_battery_power
                name: Sortie simulée
              - entity: number.carpiquet_ems_automation_minimum_hold
                name: Durée minimale d'état

      - type: grid
        title: Sécurité
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: switch.carpiquet_ems_simulation_mode
                name: Simulation uniquement
              - entity: sensor.carpiquet_ems_data_mode
                name: Données
              - entity: sensor.carpiquet_ems_active_batteries
                name: Batteries actives
              - entity: binary_sensor.carpiquet_ems_grid_meter_health
                name: Compteur réseau
              - entity: binary_sensor.carpiquet_ems_hyper_2000_health
                name: Hyper 2000
              - entity: binary_sensor.carpiquet_ems_solarflow_2400_pro_health
                name: SolarFlow 2400 Pro


      - type: grid
        title: Session de simulation
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: binary_sensor.carpiquet_ems_simulation_session_active
                name: Session active
              - entity: sensor.carpiquet_ems_session_id
                name: Identifiant
              - entity: sensor.carpiquet_ems_session_started_at
                name: Démarrée à
              - entity: sensor.carpiquet_ems_session_duration
                name: Durée
              - entity: sensor.carpiquet_ems_session_sample_count
                name: Cycles enregistrés
              - entity: sensor.carpiquet_ems_last_session_file
                name: Dernier fichier sauvegardé
              - entity: select.carpiquet_ems_simulation_report
                name: Rapport sélectionné
              - entity: button.carpiquet_ems_prepare_simulation_report
                name: Préparer le téléchargement
              - entity: sensor.carpiquet_ems_report_download_url
                name: Lien du rapport préparé

      - type: grid
        title: Historique du moteur
        cards:
          - type: history-graph
            title: Décisions — 24 h
            hours_to_show: 24
            entities:
              - sensor.carpiquet_ems_automation_state
              - sensor.carpiquet_ems_automation_request
              - sensor.carpiquet_ems_total_simulated_battery_power

  - title: Jumeau numérique
    path: digital-twin
    icon: mdi:home-lightning-bolt-outline
    type: sections
    max_columns: 4
    sections:
      - type: grid
        title: Maison
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.carpiquet_ems_house_load
                name: Consommation reconstituée
              - entity: sensor.carpiquet_ems_grid_power
                name: Réseau réel
              - entity: sensor.carpiquet_ems_sim_grid_final
                name: Réseau simulé
              - entity: sensor.carpiquet_ems_real_grid_error
                name: Erreur réelle
              - entity: sensor.carpiquet_ems_sim_grid_error
                name: Erreur simulée
              - entity: sensor.carpiquet_ems_operation_mode
