name: Validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall custom_components/carpiquet_ems
      - run: python -m pip install pytest
      - run: pytest tests/test_algorithm.py tests/test_manifest.py tests/test_dashboard.py
