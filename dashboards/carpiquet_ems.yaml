              - entity: sensor.carpiquet_ems_virtual_solarflow_soc
                name: SOC virtuel
              - entity: sensor.carpiquet_ems_virtual_solarflow_energy
                name: Énergie virtuelle
      - type: grid
        title: Performance
        cards:
          - type: gauge
            entity: sensor.carpiquet_ems_performance_score
