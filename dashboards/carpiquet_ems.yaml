      - type: grid
        title: SolarFlow 2400 Pro
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.carpiquet_ems_real_solarflow_output
                name: Sortie réelle vers maison
              - entity: sensor.carpiquet_ems_real_solarflow_grid_input
                name: Entrée AC réelle
              - entity: sensor.carpiquet_ems_sim_solarflow_home
                name: Sortie simulée vers maison
              - entity: sensor.carpiquet_ems_solarflow_pv_to_home
                name: Solaire vers maison
              - entity: sensor.carpiquet_ems_solarflow_battery_discharge
                name: Batterie vers maison
              - entity: sensor.carpiquet_ems_solarflow_2400_pro_pv_power
                name: Production solaire
              - entity: sensor.carpiquet_ems_sim_solarflow_charge
                name: Charge simulée
              - entity: sensor.carpiquet_ems_sim_solarflow_export_pool
                name: Surplus vers bus AC
              - entity: sensor.carpiquet_ems_sim_cross_charge_solarflow
