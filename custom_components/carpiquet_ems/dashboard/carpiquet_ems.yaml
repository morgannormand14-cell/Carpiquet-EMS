  - title: Automatisation
    path: automation
    icon: mdi:robot-industrial
    type: sections
    max_columns: 4
    sections:
      - type: grid
        title: Moteur d'automatisation
        cards:
          - type: markdown
            content: |
              # 🤖 Moteur d'automatisation
              **v0.6.5-alpha — Energy-Aware Discharge Engine**

              Le moteur v0.6.4 pilote la simulation et répartit la décharge selon
              l’énergie exploitable restante jusqu’au SOC minimum, tout en conservant
              jusqu’à 3,6 kW de puissance combinée lorsque la demande l’exige.

              **Aucune commande réelle Zendure n'est envoyée.**
          - type: entities
            title: État
            show_header_toggle: false
            entities:
              - entity: switch.carpiquet_ems_automation_engine
                name: Moteur activé
              - entity: sensor.carpiquet_ems_automation_state
                name: État
              - entity: sensor.carpiquet_ems_automation_reason
                name: Raison
              - entity: binary_sensor.carpiquet_ems_automation_safety_gate
                name: Garde-fou sécurité
              - entity: sensor.carpiquet_ems_automation_policy
                name: Stratégie
              - entity: sensor.carpiquet_ems_automation_cycle
                name: Cycle
              - entity: sensor.carpiquet_ems_automation_last_transition
                name: Dernière transition
              - entity: sensor.carpiquet_ems_automation_hold_remaining
                name: Temporisation restante

      - type: grid
        title: Décision
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.carpiquet_ems_grid_power
                name: Réseau
              - entity: number.carpiquet_ems_grid_target
                name: Cible réseau
              - entity: number.carpiquet_ems_grid_deadband
                name: Plage de lissage
              - entity: sensor.carpiquet_ems_requested_discharge
                name: Demande EMS
              - entity: sensor.carpiquet_ems_automation_request
                name: Demande automation
              - entity: sensor.carpiquet_ems_total_simulated_battery_power
                name: Sortie simulée
              - entity: number.carpiquet_ems_automation_minimum_hold
                name: Durée minimale d'état

      - type: grid
        title: Sécurité
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: switch.carpiquet_ems_simulation_mode
                name: Simulation uniquement
              - entity: sensor.carpiquet_ems_data_mode
                name: Données
              - entity: sensor.carpiquet_ems_active_batteries
                name: Batteries actives
              - entity: binary_sensor.carpiquet_ems_grid_meter_health
                name: Compteur réseau
              - entity: binary_sensor.carpiquet_ems_hyper_2000_health
                name: Hyper 2000
              - entity: binary_sensor.carpiquet_ems_solarflow_2400_pro_health
                name: SolarFlow 2400 Pro



      - type: grid
        title: Architecture runtime — Sprint 7
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.carpiquet_ems_engine_authority
                name: Autorité moteur
              - entity: sensor.carpiquet_ems_generic_engine_mode
                name: Mode Generic Engine
              - entity: binary_sensor.carpiquet_ems_generic_authority
                name: Generic possède l'autorité
              - entity: binary_sensor.carpiquet_ems_real_writes_enabled
                name: Écritures réelles activées
              - entity: binary_sensor.carpiquet_ems_command_write_locked
                name: Command Pipeline verrouillé
              - entity: binary_sensor.carpiquet_ems_command_adapter_write_locked
                name: Adaptateur Zendure verrouillé
              - entity: sensor.carpiquet_ems_mapper_systems_count
                name: Systèmes mappés
              - entity: sensor.carpiquet_ems_mapper_available_systems_count
                name: Systèmes disponibles
              - entity: binary_sensor.carpiquet_ems_mapper_ready
                name: Mapper prêt

      - type: grid
        title: Pipeline de commande
        cards:
          - type: markdown
            content: |
              # 🛡️ Command Pipeline
              **v0.6.5-alpha — Energy-Aware Discharge + Safety Pipeline**

              Les consignes du nouveau moteur énergétique sont calculées, réparties entre Hyper 2000 et SolarFlow 2400 Pro, puis validées par les garde-fous Sprint 6.

              **Écritures Zendure : VERROUILLÉES**
          - type: entities
            show_header_toggle: false
            entities:
              - entity: select.carpiquet_ems_control_mode
                name: Mode de contrôle
              - entity: sensor.carpiquet_ems_command_pipeline_state
                name: État du pipeline
              - entity: binary_sensor.carpiquet_ems_command_write_locked
                name: Verrou écriture
              - entity: binary_sensor.carpiquet_ems_command_safety_ok
                name: Validation sécurité
              - entity: binary_sensor.carpiquet_ems_would_send_command
                name: Commande qui serait envoyée
              - entity: sensor.carpiquet_ems_command_safety_reason
                name: Motif sécurité
              - entity: sensor.carpiquet_ems_command_watchdog_state
                name: État watchdog
              - entity: sensor.carpiquet_ems_safety_state
                name: État sécurité global
              - entity: sensor.carpiquet_ems_safety_state_reason
                name: Motif état sécurité
              - entity: binary_sensor.carpiquet_ems_shadow_authorized
                name: Shadow autorisé
              - entity: sensor.carpiquet_ems_safety_recovery_remaining
                name: Recovery restante
              - entity: sensor.carpiquet_ems_safety_fault_escalation_remaining
                name: Escalade vers FAULT
              - entity: sensor.carpiquet_ems_safety_hold_count
                name: HOLD cumulés
              - entity: sensor.carpiquet_ems_safety_fault_count
                name: FAULT cumulés
              - entity: sensor.carpiquet_ems_safety_recovery_count
                name: RECOVERY cumulés
              - entity: binary_sensor.carpiquet_ems_grid_source_fresh
                name: Shelly frais
              - entity: sensor.carpiquet_ems_grid_source_age
                name: Âge Shelly
              - entity: sensor.carpiquet_ems_hyper_soc_source_age
                name: Âge SOC Hyper (diagnostic)
              - entity: sensor.carpiquet_ems_solarflow_soc_source_age
                name: Âge SOC SolarFlow (diagnostic)
              - entity: sensor.carpiquet_ems_hyper_pv_source_age
                name: Âge PV Hyper (diagnostic)
              - entity: sensor.carpiquet_ems_solarflow_pv_source_age
                name: Âge PV SolarFlow (diagnostic)
          - type: entities
            title: Zendure Command Adapter — DRY-RUN 🔒
            show_header_toggle: false
            entities:
              - entity: sensor.carpiquet_ems_command_adapter_state
                name: État adaptateur
              - entity: binary_sensor.carpiquet_ems_command_adapter_write_locked
                name: Verrou écriture
              - entity: sensor.carpiquet_ems_adapter_hyper_prepared
                name: Hyper préparé
              - entity: sensor.carpiquet_ems_adapter_hyper_action
                name: Hyper action
              - entity: binary_sensor.carpiquet_ems_adapter_hyper_would_execute
                name: Hyper serait exécuté
              - entity: sensor.carpiquet_ems_adapter_solarflow_prepared
                name: SolarFlow préparé
              - entity: sensor.carpiquet_ems_adapter_solarflow_action
                name: SolarFlow action
              - entity: binary_sensor.carpiquet_ems_adapter_solarflow_would_execute
                name: SolarFlow serait exécuté
          - type: entities
            title: Hyper 2000 — Shadow
            show_header_toggle: false
            entities:
              - entity: sensor.carpiquet_ems_requested_hyper_output
                name: Demandé
              - entity: sensor.carpiquet_ems_validated_hyper_output
                name: Validé
              - entity: sensor.carpiquet_ems_actual_hyper_output_limit
                name: Réglage Zendure observé
              - entity: sensor.carpiquet_ems_hyper_command_delta
                name: Écart
          - type: entities
            title: SolarFlow 2400 Pro — Shadow
            show_header_toggle: false
            entities:
              - entity: sensor.carpiquet_ems_requested_solarflow_output
                name: Demandé
              - entity: sensor.carpiquet_ems_validated_solarflow_output
                name: Validé
              - entity: sensor.carpiquet_ems_actual_solarflow_output_limit
                name: Réglage Zendure observé
              - entity: sensor.carpiquet_ems_solarflow_command_delta
                name: Écart

      - type: grid
        title: Session de simulation
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: binary_sensor.carpiquet_ems_simulation_session_active
                name: Session active
              - entity: sensor.carpiquet_ems_recording_state
                name: État de l'enregistrement
              - entity: sensor.carpiquet_ems_engine_initialization_state
                name: Initialisation du moteur
              - entity: binary_sensor.carpiquet_ems_engine_initialization_ready
                name: Données initiales valides
              - entity: sensor.carpiquet_ems_engine_initialization_error
                name: Erreur d'initialisation
              - entity: binary_sensor.carpiquet_ems_simulation_session_finalizing
                name: Finalisation en cours
              - entity: sensor.carpiquet_ems_session_save_error
                name: Erreur de sauvegarde
              - entity: sensor.carpiquet_ems_last_session_ended_at
                name: Dernière fin de session
              - entity: sensor.carpiquet_ems_session_id
                name: Identifiant
              - entity: sensor.carpiquet_ems_session_started_at
                name: Démarrée à
              - entity: sensor.carpiquet_ems_session_duration
                name: Durée
              - entity: sensor.carpiquet_ems_session_sample_count
                name: Cycles enregistrés
              - entity: sensor.carpiquet_ems_last_session_file
                name: Dernier fichier sauvegardé
              - entity: select.carpiquet_ems_simulation_report
                name: Rapport sélectionné
              - entity: button.carpiquet_ems_prepare_simulation_report
                name: Préparer le téléchargement
              - entity: sensor.carpiquet_ems_report_download_url
                name: Lien du rapport préparé

      - type: grid
        title: Historique du moteur
        cards:
          - type: history-graph
            title: Décisions — 24 h
            hours_to_show: 24
            entities:
              - sensor.carpiquet_ems_automation_state
              - sensor.carpiquet_ems_automation_request
              - sensor.carpiquet_ems_total_simulated_battery_power

