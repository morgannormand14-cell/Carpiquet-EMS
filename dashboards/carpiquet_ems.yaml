              - entity: sensor.carpiquet_ems_sim_hyper_charge
                name: Charge simulée
              - entity: sensor.carpiquet_ems_sim_hyper_export_pool
                name: Surplus vers bus AC
              - entity: sensor.carpiquet_ems_sim_cross_charge_hyper
