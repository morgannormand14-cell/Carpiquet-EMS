title: Carpiquet EMS
views:
  - title: Cockpit
    path: cockpit
    icon: mdi:home-lightning-bolt
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |
              # 🏴 Carpiquet EMS
              **Every watt counts.**

              *Intelligent energy management for Zendure.*

              **Mode : SIMULATION**
              **Sprint 6 — Dynamic Multi-System Architecture**
          - type: tile
            entity: sensor.carpiquet_ems_system_status
            name: État général
            icon: mdi:heart-pulse
          - type: gauge
            entity: sensor.carpiquet_ems_health_score
            name: Santé EMS
            min: 0
            max: 100
            severity:
              red: 0
              yellow: 67
              green: 100

      - type: grid
        title: Synthèse système
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.carpiquet_ems_active_batteries
                name: Batteries actives
              - entity: sensor.carpiquet_ems_total_batteries
                name: Batteries détectées
              - entity: sensor.carpiquet_ems_total_battery_capacity
                name: Capacité totale
              - entity: sensor.carpiquet_ems_average_battery_soc
                name: SOC moyen
              - entity: sensor.carpiquet_ems_total_available_power
                name: Puissance disponible
              - entity: sensor.carpiquet_ems_system_status
                name: État
              - entity: sensor.carpiquet_ems_data_mode
                name: État des données
              - entity: sensor.carpiquet_ems_fallback_active_count
                name: Fallbacks actifs
              - entity: switch.carpiquet_ems_automation_engine
                name: Moteur d'automatisation
              - entity: sensor.carpiquet_ems_automation_state
                name: État du moteur

      - type: grid
        title: Réseau
        cards:
          - type: gauge
            entity: sensor.carpiquet_ems_grid_power
            name: Réseau EDF
            min: -1000
            max: 3600
            needle: true
            severity:
              green: -1000
              yellow: 20
              red: 1000
          - type: entities
            title: Régulation
            show_header_toggle: false
            entities:
              - entity: sensor.carpiquet_ems_grid_power
                name: Import / export
              - entity: sensor.carpiquet_ems_requested_discharge
                name: Décharge demandée
              - entity: sensor.carpiquet_ems_effective_request
                name: Demande effective
              - entity: sensor.carpiquet_ems_unserved_power
                name: Puissance non servie
              - entity: sensor.carpiquet_ems_total_simulated_battery_power
                name: Puissance simulée totale
              - entity: sensor.carpiquet_ems_simulated_grid_power
                name: Réseau simulé
              - entity: number.carpiquet_ems_grid_target
                name: Cible réseau
              - entity: number.carpiquet_ems_grid_deadband
                name: Plage de lissage
              - entity: number.carpiquet_ems_ramp_limit
                name: Rampe

      # __CARPIQUET_DYNAMIC_SYSTEM_CARDS__

  - title: Santé
    path: health
    icon: mdi:heart-pulse
    type: sections
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |
              # ❤️ Centre de santé EMS
              Disponibilité des sources et état du mode secours.
          - type: gauge
            entity: sensor.carpiquet_ems_health_score
            name: Score global
            min: 0
            max: 100
          - type: entities
            title: Composants
            show_header_toggle: false
            entities:
              - entity: binary_sensor.carpiquet_ems_grid_meter_health
                name: Santé compteur réseau
              # __CARPIQUET_DYNAMIC_HEALTH_ROWS__
              - entity: sensor.carpiquet_ems_system_status
                name: État système
              - entity: sensor.carpiquet_ems_data_mode
                name: Mode des données
              - entity: sensor.carpiquet_ems_last_fallback_sync
                name: Dernière synchronisation fallback

      - type: grid
        title: Hardware Command Planner — DRY-RUN 🔒
        cards:
          - type: entities
            title: Hyper 2000 — legacy_hyper
            show_header_toggle: false
            entities:
              - entity: sensor.carpiquet_ems_adapter_hyper_profile
                name: Profil
              - entity: sensor.carpiquet_ems_adapter_hyper_protocol
                name: Protocole
              - entity: sensor.carpiquet_ems_adapter_hyper_operation
                name: Opération
              - entity: sensor.carpiquet_ems_adapter_hyper_service
                name: Service prévu
              - entity: sensor.carpiquet_ems_adapter_hyper_payload
                name: Payload DRY-RUN
              - entity: sensor.carpiquet_ems_adapter_hyper_prepared
                name: Puissance préparée
              - entity: sensor.carpiquet_ems_adapter_hyper_action
                name: Action
          - type: entities
            title: SolarFlow 2400 Pro — zensdk_ac
            show_header_toggle: false
            entities:
              - entity: sensor.carpiquet_ems_adapter_solarflow_profile
                name: Profil
              - entity: sensor.carpiquet_ems_adapter_solarflow_protocol
                name: Protocole
              - entity: sensor.carpiquet_ems_adapter_solarflow_operation
                name: Opération
              - entity: sensor.carpiquet_ems_adapter_solarflow_service
                name: Service prévu
              - entity: sensor.carpiquet_ems_adapter_solarflow_payload
                name: Payload DRY-RUN
              - entity: sensor.carpiquet_ems_adapter_solarflow_prepared
                name: Puissance préparée
              - entity: sensor.carpiquet_ems_adapter_solarflow_action
                name: Action

      - type: grid
        title: Maintenance Carpiquet EMS
        cards:
          - type: tile
            entity: button.carpiquet_ems_synchroniser_carpiquet_ems
            name: Synchroniser Carpiquet EMS
            icon: mdi:sync
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.carpiquet_ems_synchroniser_carpiquet_ems

  - title: Historique
    path: history
    icon: mdi:chart-line
    cards:
      - type: history-graph
        title: Réseau et simulation — 24 h
        hours_to_show: 24
        entities:
          - sensor.carpiquet_ems_grid_power
          - sensor.carpiquet_ems_total_simulated_battery_power
          - sensor.carpiquet_ems_simulated_grid_power
      # __CARPIQUET_DYNAMIC_HISTORY_CARDS__

  - title: Zendure
    path: zendure
    icon: mdi:battery-sync
    type: sections
    max_columns: 4
    sections:
      - type: grid
        title: Sources dynamiques
        cards:
          - type: entities
            title: Live / Fallback
            show_header_toggle: false
            entities:
              - entity: sensor.carpiquet_ems_data_mode
                name: Mode des données
              - entity: sensor.carpiquet_ems_fallback_active_count
                name: Fallbacks actifs
              - entity: switch.carpiquet_ems_automation_engine
                name: Moteur d'automatisation
              - entity: sensor.carpiquet_ems_automation_state
                name: État du moteur
              - entity: sensor.carpiquet_ems_last_fallback_sync
                name: Dernière synchronisation

